apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-local
  namespace: ns-posthub-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-local
  template:
    metadata:
      labels:
        app: users-local
    spec:
      containers:
      - name: users-local
        image: users:v1.0
        imagePullPolicy: Never
        env:
        - name: MONGO_URI
          value: mongodb://users-mongo-service:27020/users
        - name: JWT_KEY
          valueFrom:
            secretKeyRef:
              name: jwtsecret
              key: JWTKEY
        resources:
          requests:
            cpu: 250m
            memory: 350Mi
          limits:
            memory: "900Mi"
            cpu: "700m"
        readinessProbe:
          httpGet:
            path: /api/users/healthcheck
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/users/healthcheck
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        ports:
        - containerPort: 3000

---
kind: Service
apiVersion: v1
metadata:
  name: users-service-local
  namespace: ns-posthub-local
spec:
  selector:
    app: users-local
  type: ClusterIP
  ports:
  - name: users-local
    port: 3000
    targetPort: 3000
    protocol: TCP
