apiVersion: apps/v1
kind: Deployment
metadata:
  name: comments-local
  namespace: ns-posthub-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comments-local
  template:
    metadata:
      labels:
        app: comments-local
    spec:
      containers:
      - name: comments-local
        image: comments:v1.0
        imagePullPolicy: Never
        env:
        - name: MONGO_URI
          value: mongodb://comments-mongo-service:27020/comments
        - name: JWT_KEY
          valueFrom:
            secretKeyRef:
              name: jwtsecret
              key: JWTKEY
        - name: NATS_CLUSTER_ID
          value: posthubcluster
        - name: NATS_CLIENT_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NATS_URL
          value: 'http://nats-eventhub-service:4222'
        resources:
          requests:
            cpu: 250m
            memory: 350Mi
          limits:
            memory: "900Mi"
            cpu: "700m"
        readinessProbe:
          httpGet:
            path: /api/comments/healthcheck
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/comments/healthcheck
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        ports:
        - containerPort: 3000

---
kind: Service
apiVersion: v1
metadata:
  name: comments-service-local
  namespace: ns-posthub-local
spec:
  selector:
    app: comments-local
  type: ClusterIP
  ports:
  - name: comments-local
    port: 3000
    targetPort: 3000
    protocol: TCP
