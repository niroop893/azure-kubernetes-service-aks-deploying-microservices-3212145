apiVersion: v1
kind: Namespace
metadata:
  name: ns-posthub-local
  labels:
    name: ns-posthub-local

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: posts-local
  namespace: ns-posthub-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: posts-local
  template:
    metadata:
      labels:
        app: posts-local
    spec:
      containers:
      - name: posts-local
        image: posts:v1.0
        imagePullPolicy: IfNotPresent
        env:
        - name: MONGO_URI
          value: mongodb://posts-mongo-service:27020/posts
        - name: JWT_KEY
          valueFrom:
            secretKeyRef:
              name: jwtsecret
              key: JWTKEY
        - name: NATS_CLUSTER_ID
          value: posthubcluster
        - name: NATS_CLIENT_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NATS_URL
          value: 'http://nats-eventhub-service:4222'
        resources:
          requests:
            cpu: 250m
            memory: 350Mi
          limits:
            memory: "900Mi"
            cpu: "700m"
        readinessProbe:
          httpGet:
            path: /api/posts/healthcheck
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
        ports:
        - containerPort: 3000

---
kind: Service
apiVersion: v1
metadata:
  name: posts-service-local
  namespace: ns-posthub-local
spec:
  selector:
    app: posts-local
  type: ClusterIP
  ports:
  - name: posts-local
    port: 3000
    targetPort: 3000
    protocol: TCP
